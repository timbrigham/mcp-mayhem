[project]
name = "guard-coverage"
version = "0.1.0"
description = "Incident-Driven Guard Coverage: how well regression-tested guards on an AI agent's tool use keep up with the risky actions agents attempt."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["guard_coverage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
