[project]
name = "reservoirsearch"
version = "0.1.0"
description = "Read-only search over a local copy of the Lean Reservoir package index, loaded once and answered from memory."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8.0"]

[project.scripts]
reservoirsearch-mcp = "reservoir_server.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["reservoir_core", "reservoir_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
